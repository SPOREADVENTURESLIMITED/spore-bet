name: Validate SPORE BET

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Pages Functions JavaScript syntax
        run: |
          find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
          grep -q 'ADMIN_BOOTSTRAP_TOKEN' functions/api/admin/bootstrap.js
          grep -q "role = 'admin'" functions/api/admin/bootstrap.js
          grep -q 'admin_bootstrap' migrations/0006_first_admin_bootstrap.sql
          grep -q 'bootstrapAdmin' admin.html
          grep -q 'last_seen_at' functions/api/_auth.js
          grep -q 'revoke-all' admin.html
          grep -q 'admin_sessions_revoked' functions/api/admin/sessions/revoke-all.js
          grep -q 'last_seen_at' migrations/0007_session_idle_timeout.sql
      - name: Syntax-check post-deploy smoke script
        run: node --check scripts/post-deploy-smoke.mjs
      - name: Run session security unit tests
        run: npm test
      - name: Validate web app manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
      - name: Verify PWA wiring and content-type rules
        run: |
          grep -q 'rel="manifest"' index.html
          grep -q 'navigator.serviceWorker.register("/sw.js")' index.html
          grep -q 'Content-Type: application/manifest+json' _headers
          grep -q 'Content-Type: application/javascript' _headers
